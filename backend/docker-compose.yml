# Backend stack: Kafka broker + log-collector service.
#
# Run from backend/:  docker compose up -d
#
# Ports exposed on the host:
#   9092  Kafka (PLAINTEXT, for SDKs / external producers)
#   4665  Collector HTTP query API (mapped to container port 8080)
#
# Persistence:
#   - Kafka broker state lives on the host under `KAFKA_DATA_DIR`
#     (default `/home/marcuspeh/data/logging-system/kafka`). The bind
#     mount means logs/topics survive `docker compose down/up` and even
#     `docker volume prune`.
#   - Parquet files written by the collector are persisted on the host via
#     the bind mount under `collector.volumes`. Deleting or recreating the
#     collector container does NOT remove those host files — log files are
#     durable across restarts. To wipe logs, delete the host directory
#     contents.
#
# The default host base is /home/marcuspeh/data/logging-system; edit the
# bind mounts to point at wherever you want the data stored. Kafka and
# Parquet both sit under this directory so a single tree backs the
# whole logging stack.

services:
  kafka:
    container_name: logging-kafka
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node controller+broker.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - /home/marcuspeh/data/logging-system/kafka:/var/lib/kafka/data

  collector:
    container_name: logging-collector
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4665:8080"
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "logs"
      KAFKA_GROUP_ID: "logging-collector"
      PARQUET_DIR: "/data/parquet"
      PARQUET_ROTATE_BYTES: "134217728"
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: "10s"
    volumes:
      - /home/marcuspeh/data/logging-system/logs:/data

volumes:
  kafka-data: