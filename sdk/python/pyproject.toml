[project]
name = "logging-sdk"
version = "0.1.0"
description = "Python producer SDK for the centralised logging service (Kafka-backed)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcus Peh" }]
dependencies = [
    "confluent-kafka>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["loggingsdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"