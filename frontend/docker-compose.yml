# Frontend for the logging system.
#
# Exposed on host port 7765. The browser talks to a single origin (:7765);
# the bundled serve.json reverse-proxies /api/* to the backend collector
# over the shared `logging-net` docker network. No CORS required.
#
# Run from frontend/:  docker compose up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Relative path: requests go to /api/query, the proxy in
        # serve.json forwards them to the backend.
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: logging-frontend
    restart: unless-stopped
    ports:
      - "7765:80"
    networks:
      - logging-net

networks:
  logging-net:
    external: true
