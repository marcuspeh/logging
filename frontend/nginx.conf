# Docker's embedded DNS server. The collector's container IP changes every
# time the backend stack is recreated, so nginx must not cache the A record
# it resolved at startup -- otherwise the proxy keeps dialling a stale IP and
# every /api/* request fails with 502 until nginx is restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# `resolve` re-resolves the container name every `valid` interval, so the
# upstream always points at the live collector container.
upstream logging_collector {
    zone logging_collector 64k;
    server logging-collector:8080 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any unknown path so client-side
    # routes work after a deep link / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API requests to the backend collector over the
    # shared logging-net docker network. /api/query -> backend:8080/query.
    location /api/ {
        proxy_pass http://logging_collector/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Cache hashed Vite assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
